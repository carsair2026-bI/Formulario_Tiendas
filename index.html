<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión Comercial</title>

<link rel="shortcut icon" href="./icono.png">
<link rel="icon" type="image/png" href="./icono.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #f5f7fa, #e4e8f0);
    min-height: 100vh;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

.navbar {
    background: #E51C22;
    border-radius: 25px;
    padding: 12px 30px;
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    gap: 20px;
}

.logo { height: 80px; }

.navbar-title {
    color: white;
    font-size: 40px;
    font-weight: 800;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,.12);
    border-left: 8px solid #E51C22;
}

.row {
    display: flex;
    gap: 10px;
    width: 100%;
    flex-wrap: wrap;
}

.col-30 { flex: 3; min-width: 120px; }
.col-60 { flex: 6; min-width: 200px; }
.col-10 { flex: 1; }

label {
    display: block;
    margin-top: 12px;
    font-weight: 600;
}

select, input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

button {
    margin-top: 20px;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 12px;
    background: #E51C22;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

button:disabled {
    background: #999;
}

.btn-descarga {
    margin-top: 10px;
    background: white;
    color: #E51C22;
    border: 2px solid #E51C22;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-descarga.visible {
    display: flex;
}

.btn-descarga i {
    font-size: 18px;
}

.mensaje-exito {
    position: fixed;
    top: 30px;
    right: 30px;
    background: #28a745;
    color: white;
    padding: 18px 25px;
    border-radius: 15px;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,.2);
    transform: translateX(400px);
    opacity: 0;
    transition: .4s;
    z-index: 9999;
}

.mensaje-exito.mostrar {
    transform: translateX(0);
    opacity: 1;
}

.mensaje-exito i {
    font-size: 28px;
}

@keyframes girar {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

.bi-arrow-repeat {
    display: inline-block;
    animation: girar 1s linear infinite;
}

.separador {
    margin-top: 25px;
    margin-bottom: 10px;
    padding: 12px 15px;
    background: #f8f9fa;
    border-left: 6px solid #E51C22;
    border-radius: 10px;
    font-size: 20px;
    font-weight: 700;
    color: #E51C22;
}

#loader {
    display: none;
    align-items: center;
    gap: 10px;
    color: #E51C22;
    font-weight: 600;
    margin-bottom: 15px;
}

#loader.visible {
    display: flex;
}

#loader i {
    font-size: 22px;
    animation: girar 1s linear infinite;
}
</style>
</head>

<body>
<div id="mensajeExito" class="mensaje-exito">
    <i class="bi bi-check-circle-fill"></i>
    <span>¡Registrado correctamente!</span>
</div>
<div class="navbar">
    <img src="logo.png" class="logo">
    <div class="navbar-title">Gestión Comercial</div>
</div>

<div class="container">
<div class="card">

    <h2>Formulario de Gestión</h2>
    <div id="loader" class="visible">
        <i class="bi bi-arrow-repeat"></i>
        <span>Preparando Formulario ...</span>
    </div>

    <form id="form">

        <div class="row">
            <div class="col-30">
                <label>Región</label>
                <select id="region" disabled>
                    <option value="">Seleccione su respuesta</option>
                </select>
            </div>

            <div class="col-60">
                <label>Tienda</label>
                <select id="tienda" disabled>
                    <option value="">Seleccione su respuesta</option>
                </select>
            </div>

            <div class="col-10"></div>
        </div>

        <label>Vendedor</label>
        <select id="vendedor" disabled>
            <option value="">Seleccione su respuesta</option>
        </select>
        <button type="button" id="btnDescargarLista" class="btn-descarga">
            <i class="bi bi-file-earmark-pdf-fill"></i>
            <span id="btnDescargarListaTexto">Descargar Lista de Clientes</span>
        </button>
        <div id="loaderClientes" style="display:none;align-items:center;gap:8px;margin-top:10px;color:#E51C22;font-weight:600">
            <i class="bi bi-arrow-repeat"></i>
            <span>Cargando base de clientes...</span>
        </div>
        <div class="separador">Gestión al Cliente</div>

        <div class="row">
            <div class="col-30">
                <label>Tipo Doc</label>
                <select id="tipo_doc">
                    <option value="">Seleccione su respuesta</option>
                    <option>DNI</option>
                    <option>RUC</option>
                    <option>Pasaporte</option>
                    <option>Otro</option>
                </select>
            </div>

            <div class="col-60">
                <label>Número Documento</label>
                <input id="num_doc" maxlength="20" required>
            </div>

            <div class="col-10"></div>
        </div>

        <input id="tipo_doc_otro" placeholder="Especifique el tipo de documento" style="display:none; margin-top:8px;">

        <label>Base Cliente</label>
        <select id="base">
            <option value="">Seleccione su respuesta</option>
            <option>Base Credialtoque</option>
            <option>Base 3M</option>
            <option>Base Aprobados sin compra</option>
            <option>Base Campañas</option>
        </select>

        <label>Tipo Gestión</label>
        <select id="gestion">
            <option value="">Seleccione su respuesta</option>
            <option>Telefónica y/o Whatsapp</option>
            <option>Visita terrena</option>
        </select>

        <label>Resultado</label>
        <select id="resultado">
            <option value="">Seleccione su respuesta</option>
            <option>Cliente se acercará a tienda a compra</option>
            <option>Cliente no contesta</option>
            <option>Cliente no se le ubica en vivienda</option>
            <option>Cliente no desea, por tasa</option>
            <option>Cliente no desea, no cuenta con inicial</option>
            <option>Fuera zona</option>
            <option>Cliente compro al contado</option>
            <option>Teléfono fuera de servicio / errado</option>
            <option>No pertenece a la zona</option>
        </select>

        <button id="btn" disabled>Guardar Gestión</button>

    </form>

</div>
</div>

<script>
// URL de la implementación web de Apps Script (si crea una NUEVA implementación, cámbiela aquí)
const API = "https://script.google.com/macros/s/AKfycbxU-wXtXWbRdSYrOW34jIOD5JvEwllVeQ8F2zIhTkM7EAxKR710cuo0ZULd8qAny8SV/exec";
const MAESTRO_URL  = API + "?action=maestro";
const CLIENTES_URL = API + "?action=clientes";

let datos = [];
let clientes = [];
let clientesCargados = false;
let pdfDescargado = false;

function clean(v) {
    return (v || "").toString().trim();
}

function mostrarExito() {
    const msg = document.getElementById("mensajeExito");
    msg.classList.add("mostrar");
    setTimeout(() => msg.classList.remove("mostrar"), 3000);
}

function resetForm() {
    form.reset();

    const tipoDocOtro = document.getElementById("tipo_doc_otro");
    if (tipoDocOtro) {
        tipoDocOtro.value = "";
        tipoDocOtro.style.display = "none";
    }

    tienda.innerHTML = '<option value="">Seleccione su respuesta</option>';
    vendedor.innerHTML = '<option value="">Seleccione su respuesta</option>';

    ocultarBotonDescarga();
    pdfDescargado = false;
}

/* ===== Lectura de Excel (llega en base64 desde Apps Script) ===== */
async function traerExcel(url, hojaPreferida) {
    const resp = await fetch(url, { method: "GET", cache: "no-store", redirect: "follow" });
    const text = (await resp.text()).trim();

    if (!text) throw new Error("La respuesta está vacía");
    if (text.startsWith("ERROR:")) throw new Error(text.substring(6).trim());
    if (text.startsWith("<")) {
        throw new Error("Apps Script devolvió HTML. Revise que la implementación sea 'Cualquier usuario' y esté autorizada");
    }

    const wb = XLSX.read(text, { type: "base64" });
    const nombreHoja = (hojaPreferida && wb.SheetNames.includes(hojaPreferida))
        ? hojaPreferida
        : wb.SheetNames[0];

    const filas = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], { defval: "", raw: false });

    // Limpia espacios en los nombres de columna
    return filas.map(f => {
        const o = {};
        Object.keys(f).forEach(k => { o[k.trim()] = f[k]; });
        return o;
    });
}

function procesarDatos(filas) {
    datos = filas;

    const regiones = [...new Set(
        datos.map(x => clean(x.REG)).filter(x => x)
    )];

    region.innerHTML =
        '<option value="">Seleccione su respuesta</option>' +
        regiones.map(rg => `<option>${rg}</option>`).join("");

    region.disabled   = false;
    tienda.disabled   = false;
    vendedor.disabled = false;
    btn.disabled      = false;

    document.getElementById("loader").classList.remove("visible");
}

function mostrarErrorCarga(mensaje = "Error al cargar datos. Recargue la página.") {
    const l = document.getElementById("loader");
    l.classList.add("visible");
    l.innerHTML =
        '<i class="bi bi-exclamation-triangle-fill" style="color:#E51C22;font-size:22px;animation:none"></i>' +
        `<span style="color:#E51C22">${mensaje}</span>`;
}

async function cargarMaestro() {
    try {
        const filas = await traerExcel(MAESTRO_URL, "BASE");
        console.log("Maestro cargado:", filas.length, "filas");
        procesarDatos(filas);
    } catch (err) {
        console.error("Error cargando maestro:", err);
        mostrarErrorCarga("Error al cargar datos: " + err.message);
    }
}

async function cargarClientes() {
    mostrarLoaderClientes();
    try {
        clientes = await traerExcel(CLIENTES_URL);
        console.log("Clientes cargados:", clientes.length, "filas");
    } catch (err) {
        console.error("Error cargando clientes:", err.message);
        clientes = [];
    } finally {
        clientesCargados = true;
        ocultarLoaderClientes();
        if (vendedor.value) actualizarBotonDescarga();
    }
}

cargarMaestro();
cargarClientes();

function cargarTiendas() {
    const reg = clean(region.value);
    tienda.innerHTML = '<option value="">Seleccione su respuesta</option>';
    vendedor.innerHTML = '<option value="">Seleccione su respuesta</option>';
    ocultarBotonDescarga();

    if (!reg) return;

    const tiendas = [...new Set(
        datos.filter(x => clean(x.REG) === reg).map(x => clean(x.TIENDA))
    )];
    tienda.innerHTML += tiendas.map(t => `<option>${t}</option>`).join("");
}

function mostrarLoaderClientes() {
    document.getElementById("loaderClientes").style.display = "flex";
}

function ocultarLoaderClientes() {
    document.getElementById("loaderClientes").style.display = "none";
}

function cargarVendedores() {
    const reg = clean(region.value);
    const tie = clean(tienda.value);
    vendedor.innerHTML = '<option value="">Seleccione su respuesta</option>';
    ocultarBotonDescarga();

    if (!reg || !tie) return;

    const vend = datos.filter(x =>
        clean(x.REG) === reg && clean(x.TIENDA) === tie
    );
    vendedor.innerHTML += vend.map(v =>
        `<option value="${v.ID_VEN}">${v.VENDEDOR}</option>`
    ).join("");
}

region.onchange = cargarTiendas;
tienda.onchange = cargarVendedores;

function clientesDelVendedor(idVen) {
    const idVenLimpio = clean(idVen);
    return clientes.filter(c => clean(c.DOC_VENDEDOR) === idVenLimpio);
}

function ocultarBotonDescarga() {
    document.getElementById("btnDescargarLista").classList.remove("visible");
}

function actualizarBotonDescarga() {
    const btnDesc = document.getElementById("btnDescargarLista");
    const texto = document.getElementById("btnDescargarListaTexto");

    pdfDescargado = false;

    if (!clientesCargados) {
        mostrarLoaderClientes();
        ocultarBotonDescarga();
        return;
    }

    ocultarLoaderClientes();

    if (!vendedor.value) {
        ocultarBotonDescarga();
        return;
    }

    const misClientes = clientesDelVendedor(vendedor.value);

    if (misClientes.length === 0) {
        ocultarBotonDescarga();
        return;
    }

    texto.textContent = `Descargar Lista de Clientes (${misClientes.length})`;
    btnDesc.classList.add("visible");
}
vendedor.addEventListener("change", actualizarBotonDescarga);

document.getElementById("btnDescargarLista").onclick = () => {
    const idVen = vendedor.value;
    if (!idVen) return;

    const nombreVendedor = vendedor.options[vendedor.selectedIndex].text;
    const misClientes = clientesDelVendedor(idVen);

    if (misClientes.length === 0) {
        alert("No se encontraron clientes para este vendedor.");
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "legal" });

    const columnas = [
        "DNI", "Nombre", "Perfil", "ODV", "Teléfono 1", "Teléfono 2",
        "MAF Electro", "MAF Moto", "Producto", "Distrito", "Dirección"
    ];

    const filas = misClientes.map(c => [
        clean(c.DNI),
        clean(c.NOMBRE),
        clean(c["PERFIL 2"]),
        clean(c.ODV),
        clean(c.CET),
        clean(c.CEL1),
        clean(c.MAF_TEORICO_ELECTRO),
        clean(c.MAF_TEORICO_MOTO),
        clean(c.PRODUCTO_INTERNO),
        clean(c.LOCACION),
        clean(c.DIRECCION)
    ]);

    doc.autoTable({
        startY: 26,
        margin: { top: 26 },
        showHead: "everyPage",
        head: [columnas],
        body: filas,
        theme: "grid",
        styles: { fontSize: 6.5, cellPadding: 2, overflow: "linebreak", valign: "middle" },
        headStyles: {
            fillColor: [229, 28, 34],
            textColor: 255,
            fontStyle: "bold",
            halign: "center",
            valign: "middle"
        },
        columnStyles: {
            0: { cellWidth: 25 },
            1: { cellWidth: 45 },
            2: { cellWidth: 12 },
            3: { cellWidth: 18 },
            4: { cellWidth: 20 },
            5: { cellWidth: 20 },
            6: { cellWidth: 18 },
            7: { cellWidth: 18 },
            8: { cellWidth: 30 },
            9: { cellWidth: 20 },
            10: { cellWidth: 95, overflow: "linebreak" }
        },
        didDrawPage: function (data) {
            if (data.pageNumber === 1) {
                doc.setFontSize(14);
                doc.text(`Lista de Clientes - ${nombreVendedor}`, 14, 15);
                doc.setFontSize(10);
                doc.text(`Fecha de generación: ${new Date().toLocaleString()}`, 14, 21);
            }
            const totalPaginas = doc.internal.getNumberOfPages();
            doc.setFontSize(9);
            doc.text(
                `Página ${data.pageNumber} de ${totalPaginas}`,
                doc.internal.pageSize.getWidth() - 35,
                doc.internal.pageSize.getHeight() - 8
            );
        }
    });

    doc.save(`Clientes_${nombreVendedor.replace(/\s+/g, "_")}.pdf`);
    pdfDescargado = true;
};

tipo_doc.onchange = () =>
    tipo_doc_otro.style.display = tipo_doc.value === "Otro" ? "block" : "none";

form.onsubmit = async (e) => {

    e.preventDefault();

    if (
        !region.value || !tienda.value || !vendedor.value ||
        !tipo_doc.value || !num_doc.value.trim() ||
        !base.value || !gestion.value || !resultado.value
    ) {
        alert("Complete todos los campos");
        return;
    }

    if (tipo_doc.value === "Otro" && !tipo_doc_otro.value.trim()) {
        alert("Especifique el tipo de documento");
        tipo_doc_otro.focus();
        return;
    }

    const v = datos.find(x => clean(x.ID_VEN) == clean(vendedor.value));

    if (!v) {
        alert("Vendedor no válido");
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Enviando...';

    const payload = {
        REG: clean(v.REG),
        TIENDA: clean(v.TIENDA),
        VENDEDOR: clean(v.VENDEDOR),
        ID_VEN: clean(v.ID_VEN),
        TIPO_DOCUMENTO: tipo_doc.value === "Otro" ? tipo_doc_otro.value.trim() : tipo_doc.value,
        NUMERO_DOCUMENTO: num_doc.value.trim(),
        BASE_CLIENTE: base.value,
        TIPO_GESTION: gestion.value,
        RESULTADO: resultado.value,
        DESCARGO_PDF: pdfDescargado ? "SI" : "NO"
    };

    console.log("Enviando gestión:", payload);

    try {

        await fetch(API, {
            method: "POST",
            mode: "no-cors",
            body: new URLSearchParams(payload)
        });

        console.log("Solicitud enviada correctamente");
        mostrarExito();
        resetForm();

    } catch (err) {

        console.error("Error enviando gestión:", err);
        alert("Error al guardar. Intente nuevamente.");

    } finally {

        btn.disabled = false;
        btn.innerText = "Guardar Gestión";
    }
};
</script>

</body>
</html>
